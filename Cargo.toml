[workspace]
members = ["crates/omafeed-core", "crates/omafeed-app"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pch/omafeed"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
chrono = "0.4"
serde_json = "1"
tempfile = "3"
tokio = "1"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source-ref:
        description: Exact release source commit to check
        type: string
        default: ""

permissions:
  contents: read

# A release's run (called with source-ref) has its own group, so it never
# queues behind or cancels a push run.
concurrency:
  group: ${{ inputs.source-ref && format('ci-release-{0}', inputs.source-ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test, and smoke test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          rust git gtk4 libadwaita webkitgtk-6.0 pkgconf
          xorg-server-xvfb dbus desktop-file-utils appstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          have=$(rustc --version | cut -d' ' -f2)
          printf '%s\n%s\n' "$msrv" "$have" | sort -VC || { echo "rustc $have < MSRV $msrv"; exit 1; }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Desktop smoke test (headless GTK/WebKit)
        env:
          # Containers lack the namespaces WebKit's sandbox needs, and a GPU.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          dbus-run-session -- xvfb-run -a
          cargo test -p omafeed --features test-support --locked --test desktop_smoke -- --ignored
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/io.github.pch.Omafeed.desktop
          appstreamcli validate --no-net data/io.github.pch.Omafeed.metainfo.xml

  msrv:
    name: Build with the minimum supported Rust version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed rustup git gtk4 libadwaita webkitgtk-6.0 pkgconf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Install the toolchain named by rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo "+$MSRV" build --workspace --all-targets --all-features --locked

  package:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed rust git gtk4 libadwaita webkitgtk-6.0 pkgconf namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: makepkg (current checkout)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          # Build the -git recipe from this checkout rather than the published repository.
          sed -i "s|git+https://github.com/pch/omafeed.git|git+file://$GITHUB_WORKSPACE|" packaging/omafeed-git/PKGBUILD
          su builder -c "git config --global --add safe.directory '*' && cd packaging/omafeed-git && makepkg --noconfirm"
          namcap packaging/omafeed-git/PKGBUILD packaging/omafeed-git/*.pkg.tar.zst

  audit:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

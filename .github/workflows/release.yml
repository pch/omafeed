name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts (x86_64)
    needs: ci
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed rust git gtk4 libadwaita webkitgtk-6.0 pkgconf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and stage
        run: |
          make build
          make install DESTDIR="$PWD/stage" PREFIX=/usr
      - name: Package
        run: |
          mkdir dist
          name="omafeed-$VERSION-$(uname -m)-linux"
          tar -C stage -czf "dist/$name.tar.gz" usr
          # Fill the source checksum into the release PKGBUILD.
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" -o source.tar.gz
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
            packaging/omafeed/PKGBUILD > dist/PKGBUILD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64
          path: dist/
          if-no-files-found: error

  # Arch Linux has no official aarch64 container image, and Ubuntu 24.04's
  # libadwaita is older than 1.6, so build on Debian 13. The binary links the
  # same GTK, libadwaita and WebKitGTK sonames as Arch Linux ARM.
  build-aarch64:
    name: Build release artifacts (aarch64)
    needs: ci
    runs-on: ubuntu-24.04-arm
    container: debian:13
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and stage
        run: |
          make build
          make install DESTDIR="$PWD/stage" PREFIX=/usr
          # The command line loads GTK without a display, so this checks the libraries link.
          stage/usr/bin/omafeed --version
      - name: Package
        run: |
          mkdir dist
          tar -C stage -czf "dist/omafeed-$VERSION-$(uname -m)-linux.tar.gz" usr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-aarch64
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, build-aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Omafeed ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Binaries are built on Arch Linux and need gtk4, libadwaita, and webkitgtk-6.0. The aarch64 build is made on Debian 13 and needs the same libraries. For an Arch package, download PKGBUILD and run makepkg -si."

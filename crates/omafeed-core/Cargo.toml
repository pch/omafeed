[package]
name = "omafeed-core"
description = "Storage, feed fetching, and OPML support for Omafeed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
chrono = { workspace = true, features = ["serde"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
ammonia = "4"
base64 = "0.23"
feed-rs = "2"
futures-util = "0.3"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp"] }
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
resvg = { version = "0.48", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

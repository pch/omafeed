[package]
name = "omafeed-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
ammonia = "4"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2"
futures-util = "0.3"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
toml = "0.8"
url = "2"
httpdate = "1"
scraper = "0.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp"] }
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
tempfile = "3"
